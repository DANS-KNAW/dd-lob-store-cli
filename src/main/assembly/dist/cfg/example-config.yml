#
# See https://www.dropwizard.io/en/latest/manual/configuration.html#logging
#
logging:
  level: INFO
  appenders:
    - type: file
      archive: false
      timeZone: system
      currentLogFilename: ${HOME}/dd-lob-store-cli.log

apiUrl: 'http://localhost:20385/'

httpClient:
  connectTimeout: 30s
  timeout: 60s
